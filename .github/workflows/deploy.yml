name: Deploy
on: deployment
jobs:
  build_job:
    runs-on: ubuntu-latest
    name: build dockers
    if: |
      github.event.deployment.environment == 'dev1' ||
      github.event.deployment.environment == 'dev' ||
      github.event.deployment.environment == 'cicd' ||
      github.event.deployment.environment == 'test' ||
      github.event.deployment.environment == 'e2e'
    steps:
      - name: get environment
        run: |
          curl https://api.ipify.org
          echo "environment is: $DEPLOY_ENVIRONMENT"
          URL=''
          case "$DEPLOY_ENVIRONMENT" in
            *dev1*)
              export URL=$DEV1_URL
              ;;
            *dev*)
              export URL=$DEV_URL
              ;;
            *e2e*)
              export URL=$E2E_URL
              ;;
            *test*)
              export URL=$TEST_URL
              ;;
            *cicd*)
              export URL=$CICD_URL
              ;;
            **)
              echo "unknown environment. defaulting to cicd"
              export URL=$CICD_URL
              ;;
          esac
          echo URL=$URL >> $GITHUB_ENV
        env:
          DEPLOY_ENVIRONMENT: "${{ github.event.deployment.environment }}"
          CICD_URL: ${{ secrets.CICD_URL }}
          DEV1_URL: ${{ secrets.DEV1_URL }}
          DEV_URL: ${{ secrets.DEV_URL }}
          E2E_URL: ${{ secrets.E2E_URL }}
          TEST_URL: ${{ secrets.TEST_KUBERNETES_MASTER_IP }}
      - name: set deployment status to in progress
        id: start_deployment
        uses: octokit/request-action@v2.x
        with:
          route: POST /repos/:repository/deployments/:deployment/statuses
          repository: ${{ github.repository }}
          deployment: ${{ github.event.deployment.id }}
          environment: dev
          environment_url: https://${{ env.URL }}/hkube/dashboard/
          log_url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          state: in_progress
          mediaType: '{"previews": ["flash", "ant-man"]}'
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
      - name: Checkout
        uses: actions/checkout@v2
      - name: stam
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: |
          echo "$GITHUB_CONTEXT"
          env

      - name: Checkout helm
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git clone "https://${{ secrets.GH_TOKEN }}@github.com/kube-HPC/helm.git" "$HOME/helm"
          cd $HOME/helm
          git checkout ${{ github.event.deployment.ref }} || git checkout -b ${{ github.event.deployment.ref }}
          git status
      - uses: actions/setup-node@v2-beta
        with:
          node-version: 18.x
      - name: Docker login
        run: echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USER }} --password-stdin
      - name: build changed
        id: build_changed
        uses: yehiyam/deploy-to-k8s@master
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          prNumber: ${{ github.event.deployment.payload.prNumber }}
          branchName: ${{ github.event.ref }}

      - uses: actions/upload-artifact@v4
        with:
          name: values.yaml
          path: $HOME/helm/hkube/values.yaml
      - name: update helm repo
        run: |
          cd $HOME/helm/hkube
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          set +e
          git diff --exit-code --quiet
          if [ "$?" == 1 ]; then
            set -e
            git add values.yaml
            git commit -m "update version [skip ci]"
            git push --set-upstream origin ${{ github.event.deployment.ref }}
          fi
      - name: get-helm
        run: |
          curl -LO https://get.helm.sh/helm-v3.2.4-linux-amd64.tar.gz
          tar -zxvf helm-v3.2.4-linux-amd64.tar.gz
          mv linux-amd64/helm $HOME/helm3
      - name: package
        run: |
          cd $HOME/helm/hkube
          $HOME/helm3 package . --app-version=${{ steps.build_changed.outputs.version}} --version=${{ steps.build_changed.outputs.version}} -d /tmp/
          mv /tmp/hkube-${{ steps.build_changed.outputs.version}}.tgz /tmp/chart.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: chart.tgz
          path: /tmp/chart.tgz
      - name: set values
        run: |
          envsubst < ${{ github.workspace }}/scripts/values-${{ github.event.deployment.environment }}-template.yml > /tmp/dev1.yml
        shell: bash
        env:
          DOCKER_BUILD_PUSH_PASSWORD: ${{ secrets.DOCKER_BUILD_PUSH_PASSWORD }}
          DOCKER_BUILD_PUSH_USERNAME: ${{ secrets.DOCKER_BUILD_PUSH_USERNAME }}
          IMAGE_PULL_USERNAME: ${{ secrets.IMAGE_PULL_USERNAME }}
          IMAGE_PULL_PASSWORD: ${{ secrets.IMAGE_PULL_PASSWORD }}
          KEYCLOAK_ADMIN_PASS: ${{ secrets.KC_ADMIN_PASSWORD }}
          E2E_URL: ${{ secrets.E2E_URL }}
          DEV_URL: ${{ secrets.DEV_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: dev1.yml
          path: /tmp/dev1.yml
          retention-days: 1
      - name: set deployment status to failure
        id: failed_deployment
        uses: octokit/request-action@v2.x
        if: failure()
        with:
          route: POST /repos/:repository/deployments/:deployment/statuses
          repository: ${{ github.repository }}
          deployment: ${{ github.event.deployment.id }}
          environment: dev
          environment_url: https://${{ env.URL }}/hkube/dashboard/
          log_url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          mediaType: '{"previews": ["ant-man"]}'
          state: failure
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
    outputs:
      chart: chart.tgz
      values: dev1.yml
  deploy:
    runs-on: [self-hosted, hkube-self-hosted]
    needs:
      - build_job
    name: deploy
    steps:
      - name: get environment
        run: |
          echo "running deploy.yml from ref: ${{ github.event.deployment.ref }}"
          echo "environment is: $DEPLOY_ENVIRONMENT"
          # single kubeconfig on the runner holds all cluster contexts; select via context
          case "$DEPLOY_ENVIRONMENT" in
            *dev1*)
              CONTEXT=dev1-spot.hkube.org
              URL=$DEV1_URL
              ;;
            *dev*)
              CONTEXT=dev.hkube.org
              URL=$DEV_URL
              ;;
            *e2e*)
              CONTEXT=e2e.hkube.org
              URL=$E2E_URL
              ;;
            *test*)
              CONTEXT=test-spot.hkube.org
              URL=$TEST_URL
              ;;
            *cicd*)
              CONTEXT=cicd-spot.hkube.org
              URL=$CICD_URL
              ;;
            *)
              echo "unknown environment. defaulting to cicd"
              CONTEXT=cicd-spot.hkube.org
              URL=$CICD_URL
              ;;
          esac
          echo "selected context: $CONTEXT"
          export KUBECONFIG=/etc/hkube/kube/config
          kubectl config use-context "$CONTEXT"
          echo KUBECONFIG=/etc/hkube/kube/config >> $GITHUB_ENV
          echo URL=$URL >> $GITHUB_ENV
        env:
          DEPLOY_ENVIRONMENT: "${{ github.event.deployment.environment }}"
          CICD_URL: ${{ secrets.CICD_URL }}
          DEV1_URL: ${{ secrets.DEV1_URL }}
          DEV_URL: ${{ secrets.DEV_URL }}
          E2E_URL: ${{ secrets.E2E_URL }}
          TEST_URL: ${{ secrets.TEST_URL }}
      - name: download chart
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build_job.outputs.chart }}
      - name: download values
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build_job.outputs.values }}
      - name: verify kubectl
        run: kubectl cluster-info
      - name: deploy
        run: |
          helm ls
          helm upgrade -i hkube --wait --timeout 15m -f ${{ github.workspace }}/${{ needs.build_job.outputs.values }} ${{ github.workspace }}/${{ needs.build_job.outputs.chart }}
          helm ls
      - name: set deployment status to success
        id: successful_deployment
        uses: octokit/request-action@v2.x
        with:
          route: POST /repos/:repository/deployments/:deployment/statuses
          repository: ${{ github.repository }}
          deployment: ${{ github.event.deployment.id }}
          environment: dev
          environment_url: https://${{ env.URL }}/hkube/dashboard/
          log_url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          mediaType: '{"previews": ["ant-man"]}'
          state: success
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: set deployment status to failure
        id: failed_deployment
        uses: octokit/request-action@v2.x
        if: failure()
        with:
          route: POST /repos/:repository/deployments/:deployment/statuses
          repository: ${{ github.repository }}
          deployment: ${{ github.event.deployment.id }}
          environment: dev
          environment_url: https://${{ env.URL }}/hkube/dashboard/
          log_url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          mediaType: '{"previews": ["ant-man"]}'
          state: failure
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
