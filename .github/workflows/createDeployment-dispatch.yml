name: CreateDeployment (dispatch)
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (default: dev1)'
        required: false
        default: dev1                 # same default as today
        type: choice
        options: [dev1, test, cicd]
      prNumber:
        description: 'Specific PR number to deploy (optional; overrides branch auto-resolution)'
        required: false
        type: string

permissions:
  contents: read
  deployments: write
  pull-requests: write                # rejection comment on the PR

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.gate.outputs.environment }}
      ref:         ${{ steps.gate.outputs.ref }}
      prNumber:    ${{ steps.gate.outputs.prNumber }}
    steps:
      - name: Resolve PR + fork-check + authorize
        id: gate
        uses: actions/github-script@v7
        with:
          # PAT: the default GITHUB_TOKEN cannot always read org membership.
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const org  = context.repo.owner;
            const repo = context.repo.repo;
            const base = `${org}/${repo}`;
            const actor = context.actor;
            const environment = context.payload.inputs.environment || 'dev1';
            const branch = context.ref.replace('refs/heads/', '');
            const prInput = (context.payload.inputs.prNumber || '').trim();

            core.info(`--- CreateDeployment (dispatch) gate ---`);
            core.info(`repo:        ${base}`);
            core.info(`actor:       ${actor}`);
            core.info(`branch:      ${branch}`);
            core.info(`environment: ${environment}`);
            core.info(`prNumber in: ${prInput || '(none - auto-resolve from branch)'}`);

            let prNumber; // set once the PR is resolved

            // Post a rejection comment on the PR (if known), then fail the run.
            async function reject(reason) {
              core.error(`REJECTED: ${reason}`);
              if (prNumber) {
                try {
                  await github.rest.issues.createComment({
                    owner: org, repo, issue_number: prNumber,
                    body: `:no_entry: Deployment refused: ${reason}`,
                  });
                  core.info(`posted rejection comment on PR #${prNumber}`);
                } catch (e) { core.warning(`could not comment: ${e.message}`); }
              }
              core.setFailed(reason);
            }

            // ---- Resolve the PR: explicit input overrides branch auto-resolution ----
            let pr;
            if (prInput) {
              core.info(`explicit prNumber '${prInput}' provided - overriding branch resolution`);
              const { data } = await github.rest.pulls.get({
                owner: org, repo, pull_number: Number(prInput),
              });
              pr = data;
            } else {
              core.info(`resolving open PR for head '${org}:${branch}' (sort=created, direction=desc)...`);
              const { data: prs } = await github.rest.pulls.list({
                owner: org, repo, state: 'open', head: `${org}:${branch}`,
                sort: 'created', direction: 'desc',
              });
              if (prs.length === 0) {
                return reject(`No open PR found for branch '${branch}'.`);
              }
              if (prs.length > 1) {
                core.warning(`found ${prs.length} open PRs for '${branch}'; using the most recently ` +
                  `created (pass the prNumber input to pick another): ` +
                  prs.map(p => `#${p.number} (created ${p.created_at})`).join(', '));
              }
              pr = prs[0];
            }
            prNumber = pr.number;
            core.info(`resolved PR #${prNumber}: "${pr.title}"`);
            core.info(`  author:   @${pr.user?.login}`);
            core.info(`  head:     ${pr.head.repo?.full_name}@${pr.head.ref} (${pr.head.sha?.slice(0, 7)})`);
            core.info(`  base:     ${pr.base.repo?.full_name}@${pr.base.ref}`);
            core.info(`  html_url: ${pr.html_url}`);

            // ---- Layer 2: fork check ----
            if (!pr.head.repo || pr.head.repo.full_name !== base) {
              return reject(`PR #${prNumber} head is a fork (${pr.head.repo?.full_name}).`);
            }
            core.info(`fork check passed: head repo is ${base}`);

            // ---- Layer 3a: strict org membership ----
            core.info(`checking org membership: is @${actor} a member of ${org}?`);
            try {
              await github.rest.orgs.checkMembershipForUser({ org, username: actor });
            } catch (e) {
              return reject(`@${actor} is not a member of the ${org} org.`);
            }
            core.info(`org membership check passed: @${actor} is a member of ${org}`);

            // ---- Layer 3b: push access ----
            core.info(`checking push access for @${actor} on ${base}...`);
            const { data: perm } =
              await github.rest.repos.getCollaboratorPermissionLevel({
                owner: org, repo, username: actor,
              });
            if (!['admin', 'write'].includes(perm.permission)) {
              return reject(`@${actor} lacks push access (permission: ${perm.permission}).`);
            }
            core.info(`push access check passed: @${actor} has '${perm.permission}' permission`);

            core.info(`--- gate passed ---`);
            core.info(`deploying PR #${prNumber} ("${pr.title}") ` +
              `-> env=${environment} ref=${pr.head.ref}`);
            core.setOutput('environment', environment);
            core.setOutput('ref', pr.head.ref);
            core.setOutput('prNumber', String(prNumber));

  deployment:
    needs: authorize
    runs-on: ubuntu-latest
    steps:
      - name: create deployment
        uses: octokit/request-action@v2.x
        with:
          route: POST /repos/:repository/deployments
          repository: ${{ github.repository }}
          ref:         ${{ needs.authorize.outputs.ref }}
          environment: ${{ needs.authorize.outputs.environment }}
          auto_merge: false
          required_contexts: "[]"
          payload: |
            prNumber: ${{ needs.authorize.outputs.prNumber }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
