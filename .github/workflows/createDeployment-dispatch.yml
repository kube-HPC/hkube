name: CreateDeployment (dispatch)
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (default: dev1)'
        required: false
        default: dev1                 # same default as today
        type: choice
        options: [dev1, test, cicd]
      branch:
        description: 'Branch (or ref) to deploy (optional; defaults to the branch this workflow is run from)'
        required: false
        type: string

permissions:
  contents: read
  deployments: write

jobs:
  deployment:
    runs-on: ubuntu-latest
    steps:
      - name: create deployment
        uses: octokit/request-action@v2.x
        with:
          route: POST /repos/:repository/deployments
          repository: ${{ github.repository }}
          ref:         ${{ github.event.inputs.branch || github.ref_name }}
          environment: ${{ github.event.inputs.environment }}
          auto_merge: false
          required_contexts: "[]"
          payload: |
            prNumber: ""
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}


