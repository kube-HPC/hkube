global:
  clusterName: dev
  hkube_url: "${DEV_URL}/hkube"
  storage:
    binary: true
    fs:
      base_directory: /hkubedata
      pvc:
        capacity: 50Gi
        name: hkube-storage
        nfs_root: /nfs/storageclass/dev
        nfs_server: 10.30.239.124
        storage_class: "-"
      dev_pvc:
        name: hkube-dev-sources
        capacity: 10Gi
        storage_class: "nfs-client"
        enabled: true
  ingress:
    use_regex: true
  registry_username: ${IMAGE_PULL_USERNAME}
  registry_password: ${IMAGE_PULL_PASSWORD}
  health_monitoring:
    enabled: true
    dataSourceUrl: "http://metric-kube-prometheus-sta-prometheus.monitoring.svc.dev:9090"
api_server:
  env:
    rate_limit_ms: 1000
    rate_limit_max: 20
    rate_limit_redis_enabled: true
env:
  kibana_url: "${DEV_URL}/system/kibana/"
  grafana_url: "${DEV_URL}/grafana"
  default_storage: "fs"

build_secret:
  docker_registry: ""
  docker_namespace: ""
  docker_username: ${DOCKER_BUILD_PUSH_USERNAME}
  docker_password: ${DOCKER_BUILD_PUSH_PASSWORD}

etcd:
  persistentVolume:
    enabled: true
    storageClass: etcd-sc

task_executor:
  env:
    pipeline_drivers_amount: 5
    use_resource_limits: true

monitor_server:
  env:
    elasticsearch_service_url: 'http://elasticsearch-ingest.logging:9200'

storage_cleaner:
  pattern: "30 7 * * *"

etcd_cleaner:
  pattern: "30 7 * * *"

cassandra:
  persistence:
    storageClass: nfs-client

mongodb:
  persistence:
    storageClass: nfs-client

postgresql:
  persistence:
    storageClass: nfs-client

gitea:
  persistence:
    storageClass: nfs-client

jaeger:
  enable: true
  query:
    ingress:
      enabled: true
      annotations:
        kubernetes.io/ingress.class: nginx
    service:
      port: 80
      annotations: {}
      type: ClusterIP
      loadBalancerSourceRanges: []

minio:
  enable: true

keycloak:
  enable: false
  auth:
    adminPassword: ${KEYCLOAK_ADMIN_PASS}

