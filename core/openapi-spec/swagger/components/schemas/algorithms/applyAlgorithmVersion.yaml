type: object
properties:
  name:
    $ref: "#/components/schemas/algorithmName"
  version:
    $ref: "#/components/schemas/algorithmVersionId"
  force:
    type: boolean
    description: should replace or not current algorithm version for running algorithm instances
    default: false
  graceful:
    type: boolean
    description: when combined with force, allows currently running jobs to finish before applying the new version instead of stopping them immediately
    default: false
required:
  - name
  - version
