type: object
properties:
  forceUpdate:
    type: boolean
    description: Stop running algorithms if there are any and set the newly created version as current.
    default: false
  forceBuild:
    type: boolean
    description: should force new build
    default: false
  graceful:
    type: boolean
    description: when combined with forceUpdate, allows currently running jobs to finish before applying the new version instead of stopping them immediately
    default: false
