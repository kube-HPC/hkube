get:
  tags:
    - Preferences
  summary: Get user preferences
  description: Retrieve preferences for the authenticated user
  responses:
    "200":
      $ref: "#/components/responses/preferences_successGet"
    "400":
      $ref: "#/components/responses/errorBadRequest"
    "401":
      $ref: "#/components/responses/unauthorized"
    default:
      $ref: "#/components/responses/default"
put:
  tags:
    - Preferences
  summary: Set user preferences
  description: Full-replace the authenticated user's preferences
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/preferencesBody"
        example:
          theme: dark
          scoopIntervalHours: 24
          tables:
            jobs:
              columns:
                name:
                  visible: true
                  width: 200
                status:
                  visible: false
                  width: 120
            algorithms:
              columns: {}
            pipelines:
              columns: {}
  responses:
    "200":
      $ref: "#/components/responses/preferences_successSet"
    "400":
      $ref: "#/components/responses/errorBadRequest"
    "401":
      $ref: "#/components/responses/unauthorized"
    default:
      $ref: "#/components/responses/default"
delete:
  tags:
    - Preferences
  summary: Delete user preferences
  description: Remove the authenticated user's preferences
  responses:
    "200":
      $ref: "#/components/responses/preferences_successDelete"
    "400":
      $ref: "#/components/responses/errorBadRequest"
    "401":
      $ref: "#/components/responses/unauthorized"
    default:
      $ref: "#/components/responses/default"
